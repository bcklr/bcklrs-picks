<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title> BCKLR's Pick</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Barlow+Condensed:wght@300;400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        scroll-snap-type: y mandatory;
      }

      body {
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
        cursor: default;
      }

      .masthead {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        padding: 1.2rem 3rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        mix-blend-mode: normal;
      }

      .masthead-title {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #fff;
        opacity: 0.9;
      }

      .masthead-nav {
        display: flex;
        gap: 2rem;
      }

      .masthead-nav a {
        font-size: 0.65rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.5);
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .masthead nav a:hover {
        color: rgba(255,255,255,0.9);
      }

      .chapter {
        width: 100%;
        height: 100vh;
        scroll-snap-align: start;
        position: relative;
        display: flex;
        align-items: center;
        overflow: hidden;
      }

      .chapter-content {
        position: relative;
        z-index: 2;
        padding: 6rem 5rem 4rem;
        max-width: 700px;
      }

      .chapter-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      .album-cover {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 45%;
        object-fit: cover;
        z-index: 1;
        opacity: 0.35;
      }

      .cover-fade {
        position: absolute;
        inset: 0;
        z-index: 1;
      }

      .artist-number {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        margin-bottom: 1.5rem;
        opacity: 0.5;
      }

      .artist-name {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 5rem;
        font-weight: 900;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        line-height: 0.9;
        margin-bottom: 0.5rem;
      }

      .album-title {
        font-family: 'Playfair Display', serif;
        font-size: 1rem;
        font-style: italic;
        opacity: 0.6;
        margin-bottom: 0.5rem;
        letter-spacing: 0.05em;
      }

      .rating {
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        margin-bottom: 2rem;
        opacity: 0.8;
      }

      .divider {
        width: 60px;
        height: 2px;
        margin-bottom: 1.8rem;
        opacity: 0.6;
      }

      .artist-write {
        font-family: 'Playfair Display', serif;
        font-size: 1rem;
        line-height: 1.85;
        opacity: 0.85;
        max-width: 520px;
      }

      .scroll-hint {
        position: absolute;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.65rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        opacity: 0.3;
        z-index: 2;
        animation: bounce 2s infinite;
      }

      @keyframes bounce {
        0%, 100% { transform: translateX(-50%) translateY(0); }
        50% { transform: translateX(-50%) translateY(6px); }
      }
    </style>
  </head>
  <body>
